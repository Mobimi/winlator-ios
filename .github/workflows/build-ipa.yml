name: Build iOS IPA

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-ipa.yml"
  # Engine đổi → Build QEMU engine publish `devbox-engine-tcg.zip` → rebuild IPA
  # để bản cài luôn có engine mới. Không thêm `engine/**` vào `push.paths`:
  # làm vậy IPA sẽ build song song với engine và nhúng lại bản cũ.
  workflow_run:
    workflows: ["Build QEMU engine"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: app
        run: |
          xcodebuild \
            -project Devbox.xcodeproj \
            -scheme Devbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Embed QEMU engine
        run: |
          APP_PATH="app/.build/Build/Products/Release-iphoneos/Devbox.app"
          mkdir -p "$APP_PATH/Frameworks"
          URL="https://github.com/Mobimi/winlator-ios/releases/download/engine-v1/devbox-engine-tcg.zip"
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/engine.zip" "$URL"
          unzip -q "$RUNNER_TEMP/engine.zip" -d "$RUNNER_TEMP/engine"
          cp -R "$RUNNER_TEMP/engine/Frameworks/." "$APP_PATH/Frameworks/"
          BIN="$APP_PATH/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu"
          test -f "$BIN" || {
            echo "qemu framework missing from engine zip"
            exit 1
          }
          strings -a "$BIN" | grep -q "vm_remap for jit splitwx failed" || {
            echo "engine zip is stale: no split-wx support"
            exit 1
          }
          echo "engine frameworks embedded (TCG + split-wx)"
          du -sh "$APP_PATH/Frameworks"
          ls "$APP_PATH/Frameworks"

      - name: Verify Info.plist
        run: |
          PLIST="app/.build/Build/Products/Release-iphoneos/Devbox.app/Info.plist"
          test -f "$PLIST" || { echo "Info.plist not found"; exit 1; }
          MODES=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST")
          echo "UIBackgroundModes: $MODES"
          FIRST=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$PLIST")
          test "$FIRST" = "audio" || { echo "UIBackgroundModes[0] must be audio"; exit 1; }

      - name: Package IPA
        run: |
          APP_PATH="app/.build/Build/Products/Release-iphoneos/Devbox.app"
          test -d "$APP_PATH" || { echo "App bundle not found"; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry Devbox-unsigned.ipa Payload
          ls -lh Devbox-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Devbox-unsigned-ipa
          path: out/Devbox-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ipa-v1 >/dev/null 2>&1 || \
            gh release create ipa-v1 --title "Devbox IPA (unsigned)" --notes "Unsigned arm64 IPA with QEMU engine embedded. Install with Sideloadly, then enable JIT with StikDebug."
          gh release upload ipa-v1 out/Devbox-unsigned.ipa --clobber
          shasum -a 256 out/Devbox-unsigned.ipa
