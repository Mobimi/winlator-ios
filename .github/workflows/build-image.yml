name: Build Debian image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "image/build-image.sh"
      - "image/guest/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write

jobs:
  image:
    runs-on: ${{ github.event.repository.private && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host
        run: uname -a

      - name: Build Debian 13 ARM64 image
        run: sudo bash image/build-image.sh
        env:
          SUITE: trixie
          IMG_SIZE: 5G

      - name: Show output
        run: |
          ls -lh out
          cat out/manifest.json

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: devbox-debian-image
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Boot test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm python3-pexpect curl zstd
          rm -rf boottest
          mkdir -p boottest
          zstd -d -q -f out/devbox-rootfs.ext4.zst -o boottest/rootfs.ext4
          cp out/vmlinuz out/initrd.img boottest/
          python3 image/boot_test.py boottest

      - name: Publish image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view img-v1 >/dev/null 2>&1 || \
            gh release create img-v1 --title "Devbox Debian 13 ARM64 image" --notes "Debian 13 trixie ARM64 rootfs (ext4, zstd) + kernel 6.12.113 + initrd. Used by the Devbox iOS app."
          for f in devbox-rootfs.ext4.zst vmlinuz initrd.img manifest.json SHA256SUMS; do
            gh release upload img-v1 "out/$f" --clobber
          done
          cat out/SHA256SUMS
