name: Build QEMU engine

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "engine/**"
      - ".github/workflows/build-engine.yml"

permissions:
  contents: write

env:
  DEVBOX_ENGINE: tcg

jobs:
  engine:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install meson ninja pkg-config glib bison

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          meson --version
          ninja --version
          pkg-config --version

      - name: Build
        env:
          SDKMINVER: "17.0"
        run: bash engine/build-ios.sh

      - name: Verify engine
        run: |
          CONF="$(ls engine/build/src/qemu-*/build/config-host.h | head -1)"
          echo "--- config: $CONF ---"
          grep -E "CONFIG_TCG" "$CONF" || echo "(khong co dong nao)"
          case "$DEVBOX_ENGINE" in
            interp)
              grep -qE "^#define CONFIG_TCG_(THREADED_)?INTERPRETER( 1)?$" "$CONF" || \
                { echo "FAIL: build khong bat interpreter"; exit 1; }
              echo "interpreter: ON"
              ;;
            tcg)
              if grep -qE "^#define CONFIG_TCG_(THREADED_)?INTERPRETER( 1)?$" "$CONF"; then
                echo "FAIL: TCG build lai bat interpreter"
                exit 1
              fi
              echo "interpreter: OFF (TCG)"
              ;;
            *)
              echo "FAIL: DEVBOX_ENGINE khong hop le: $DEVBOX_ENGINE"
              exit 1
              ;;
          esac
          echo "--- binary ---"
          BIN="engine/out/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu"
          ls -l "$BIN"
          shasum -a 256 "$BIN"
          echo "--- split-wx ---"
          grep -qE "^#define CONFIG_DARWIN 1$" "$CONF" || \
            { echo "FAIL: engine khong build cho Darwin"; exit 1; }
          strings -a "$BIN" | grep -q "vm_remap for jit splitwx failed" || \
            { echo "FAIL: engine thieu split-wx vmremap (QEMU quá cũ?)"; exit 1; }
          echo "split-wx: ON (vm_remap)"
          nm -u "$BIN" | grep -q "_mach_vm_remap" && echo "mach_vm_remap: OK" || \
            echo "mach_vm_remap: khong thay trong nm (bo qua)"
          echo "--- marker (khong bat buoc) ---"
          strings -a "$BIN" | grep -c "devbox-engine-interp" || echo "marker bi strip, bo qua"

      - name: Config log
        if: failure()
        run: |
          echo "--- qemu config.log ---"
          tail -n 120 engine/build/src/qemu-*/config.log 2>/dev/null || true
          echo "--- meson logs ---"
          find engine/build/src -name "meson-log.txt" -exec tail -n 60 {} \; 2>/dev/null || true

      - name: List output
        if: always()
        run: |
          ls -la engine/out 2>/dev/null || true
          ls -la engine/out/Frameworks 2>/dev/null || true
          du -sh engine/sysroot 2>/dev/null || true

      - name: Upload engine
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: devbox-engine-ios-arm64
          path: engine/out/
          if-no-files-found: error

      - name: Publish engine frameworks
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd engine/out
          zip -qry "$RUNNER_TEMP/devbox-engine.zip" Frameworks
          gh release view engine-v1 >/dev/null 2>&1 || \
            gh release create engine-v1 --title "Devbox QEMU engine" --notes "QEMU 10.0.12 aarch64-softmmu for iOS arm64, packed as frameworks. devbox-engine.zip = TCG + split-wx (needs JIT via StikDebug, no MAP_JIT entitlement). devbox-engine-tcg.zip = stable TCG copy for the IPA workflow."
          if ! gh release view engine-v1 --json assets -q '.assets[].name' | grep -qx "devbox-engine-tcg.zip"; then
            cp "$RUNNER_TEMP/devbox-engine.zip" "$RUNNER_TEMP/devbox-engine-tcg.zip"
            gh release upload engine-v1 "$RUNNER_TEMP/devbox-engine-tcg.zip" --clobber
          fi
          gh release upload engine-v1 "$RUNNER_TEMP/devbox-engine.zip" --clobber
          ls -lh "$RUNNER_TEMP/devbox-engine.zip"
          shasum -a 256 "$RUNNER_TEMP/devbox-engine.zip"
